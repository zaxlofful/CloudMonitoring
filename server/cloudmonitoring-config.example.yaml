notifications:
  - type: email
    enabled: false
    settings:
      smtp_host: smtp.gmail.com
      smtp_port: 587
      sender_email: alerts@example.com
      sender_password: ${ALERT_EMAIL_PASSWORD}
      recipients:
        - player1@example.com

  - type: webhook
    enabled: true
    settings:
      url: ${ALERT_WEBHOOK_URL}
      method: POST

  - type: sms
    enabled: false
    settings:
      provider: twilio
      account_sid: ${TWILIO_ACCOUNT_SID}
      auth_token: ${TWILIO_AUTH_TOKEN}
      phone_from: +1234567890
      phone_to:
        - +1987654321

# Optional: monitor only specific items (otherwise monitor everything seen)
# monitor_items:
#   - iron-plate
#   - copper-plate

# Optional: override paths (defaults can come from env)
# game_folder: /app/gamedata
# script_output_dir: /app/gamedata/script-output
# alerts_log_path: /app/gamedata/cloudmonitoring-alerts.log
